<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Prompt Puzzle — Master AI Prompting Through Play</title>
<style>
  :root{
    --bg1:#0b0f1a; --bg2:#141b2d; --card:#171f33; --card2:#1d2740;
    --accent:#7c5cff; --accent2:#22d3ee; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    --text:#e8ecf7; --sub:#93a0c2; --border:#2a3454;
    --shadow: 0 20px 50px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #23305a55, transparent),
      radial-gradient(1000px 500px at 110% 10%, #7c5cff33, transparent),
      linear-gradient(180deg, var(--bg1), var(--bg2));
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  #app{max-width:1200px;margin:0 auto;padding:24px 20px 80px;}
  h1,h2,h3{margin:0;}
  .title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .brand{font-size:26px;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(90deg,#fff,#b8c2ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .badge{font-size:12px;color:var(--sub);background:var(--card2);border:1px solid var(--border);
    padding:4px 10px;border-radius:20px;}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));
    border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow);}
  .btn{cursor:pointer;border:none;border-radius:12px;padding:12px 20px;font-weight:700;
    font-size:14px;transition:transform .15s ease, box-shadow .15s ease, opacity .15s;
    background:linear-gradient(135deg,var(--accent),#5c3bff);color:#fff;
    box-shadow:0 8px 20px rgba(124,92,255,.35);}
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(124,92,255,.5);}
  .btn:active{transform:translateY(0);}
  .btn.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);box-shadow:none;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--sub);box-shadow:none;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .center{display:flex;align-items:center;justify-content:center;}

  /* Setup screen */
  #setup-screen .options-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0;}
  .opt-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;
    transition:all .2s ease;position:relative;}
  .opt-card:hover{border-color:var(--accent);transform:translateY(-3px);}
  .opt-card.selected{border-color:var(--accent2);box-shadow:0 0 0 2px var(--accent2) inset;}
  .opt-card .emoji{font-size:28px;}
  .opt-card .name{font-weight:700;margin-top:8px;}
  .opt-card .desc{color:var(--sub);font-size:12px;margin-top:4px;}

  /* HUD */
  #hud{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .stat-pill{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;
    font-size:13px;display:flex;gap:6px;align-items:center;min-width:90px;}
  .stat-pill b{color:#fff;}
  .stat-pill .lbl{color:var(--sub);font-size:11px;text-transform:uppercase;letter-spacing:.4px;}

  #progress-bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-bottom:20px;border:1px solid var(--border);}
  #progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width .4s ease;}

  /* Scenario area */
  .scenario-head{margin-bottom:16px;}
  .scenario-head .chip{display:inline-block;background:var(--accent2);color:#03222a;font-weight:800;
    font-size:11px;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
  .scenario-head h2{font-size:20px;margin-bottom:6px;}
  .scenario-head p{color:var(--sub);font-size:14px;line-height:1.5;}
  .goal-box{background:#0d1626;border:1px dashed var(--border);border-radius:12px;padding:14px;margin:14px 0;
    font-size:13.5px;color:#c9d3ee;}
  .goal-box b{color:var(--accent2);}

  /* Build the prompt (drag and drop) */
  .dnd-wrap{display:grid;grid-template-columns:1fr;gap:16px;margin-top:10px;}
  @media(min-width:820px){.dnd-wrap{grid-template-columns:1fr 1fr;}}
  .zone{border:1px solid var(--border);border-radius:14px;padding:14px;min-height:220px;background:#0f1729;}
  .zone h4{margin:0 0 10px;color:var(--sub);font-size:12px;text-transform:uppercase;letter-spacing:.6px;}
  .zone.drop-target.dragover{border-color:var(--accent2);background:#12233a;}
  .block{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;
    margin-bottom:8px;cursor:grab;font-size:13.5px;line-height:1.4;transition:all .15s ease;user-select:none;}
  .block:hover{border-color:var(--accent);transform:translateX(2px);}
  .block.dragging{opacity:.4;}
  .block.correct-flash{animation:flashGood .6s ease;}
  .block.wrong-flash{animation:flashBad .6s ease;}
  @keyframes flashGood{0%{background:var(--good);}100%{background:var(--card2);}}
  @keyframes flashBad{0%{background:var(--bad);}100%{background:var(--card2);}}
  .block .rm{float:right;color:var(--sub);cursor:pointer;font-size:12px;margin-left:8px;}

  /* Clean prompt challenge */
  .prompt-text-box{background:#0d1626;border:1px solid var(--border);border-radius:12px;padding:16px;
    font-family:'Consolas',monospace;font-size:13.5px;line-height:1.8;white-space:pre-wrap;}
  .tok{display:inline;padding:2px 4px;border-radius:5px;cursor:pointer;transition:all .15s;}
  .tok.flagged{background:#3a1030;text-decoration:line-through;color:#ff9db3;}
  .tok:hover{background:#22304f;}
  .tok.locked-good{color:#8be9a3;}

  /* choose best prompt */
  .choice-card{border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;cursor:pointer;
    background:#0f1729;transition:all .18s ease;position:relative;}
  .choice-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .choice-card.picked-correct{border-color:var(--good);box-shadow:0 0 0 2px var(--good) inset;}
  .choice-card.picked-wrong{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset;}
  .choice-card .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    color:var(--sub);margin-bottom:6px;display:block;}
  .choice-card pre{margin:0;white-space:pre-wrap;font-family:'Consolas',monospace;font-size:12.5px;color:#dbe2f7;}

  .footer-actions{display:flex;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:10px;}

  /* Feedback panel */
  #feedback-panel{margin-top:16px;border-radius:14px;padding:16px;font-size:13.5px;display:none;}
  #feedback-panel.show{display:block;animation:slideIn .35s ease;}
  #feedback-panel.good{background:#0f2419;border:1px solid var(--good);}
  #feedback-panel.bad{background:#2a1414;border:1px solid var(--bad);}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  /* Toast notifications */
  #toast-wrap{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:10px;}
  .toast{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;
    box-shadow:var(--shadow);font-size:13px;min-width:220px;animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;}
  .toast.good{border-color:var(--good);}
  .toast.bad{border-color:var(--bad);}
  .toast.info{border-color:var(--accent2);}
  @keyframes toastIn{from{opacity:0;transform:translateX(40px);}to{opacity:1;transform:translateX(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(40px);}}

  /* score pop */
  .score-pop{position:fixed;pointer-events:none;font-weight:800;font-size:20px;color:var(--good);
    animation:popUp 1s ease forwards;z-index:998;}
  @keyframes popUp{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-60px);}}

  /* Report screen */
  .report-grid{display:grid;grid-template-columns:1fr;gap:18px;}
  @media(min-width:900px){.report-grid{grid-template-columns:1.1fr .9fr;}}
  .score-circle{width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;margin:0 auto;background:conic-gradient(var(--accent2) calc(var(--pct)*1%), #202a44 0);
    position:relative;}
  .score-circle::before{content:'';position:absolute;inset:10px;background:var(--card);border-radius:50%;}
  .score-circle .val{position:relative;font-size:34px;font-weight:800;}
  .score-circle .lbl{position:relative;font-size:11px;color:var(--sub);text-transform:uppercase;}
  .rank-badge{text-align:center;margin-top:10px;font-weight:800;font-size:18px;
    background:linear-gradient(90deg,#fff,#b8c2ff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .dna-bars{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .dna-row{display:flex;align-items:center;gap:10px;font-size:12.5px;}
  .dna-row .name{width:120px;color:var(--sub);flex-shrink:0;}
  .dna-track{flex:1;height:10px;background:#1a2338;border-radius:8px;overflow:hidden;}
  .dna-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;
    transition:width 1s ease;}
  .dna-row .pct{width:36px;text-align:right;color:var(--text);}
  .stat-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
  .stat-table td{padding:8px 4px;border-bottom:1px solid var(--border);}
  .stat-table td:last-child{text-align:right;font-weight:700;}
  .milestone-box{background:#0d1626;border-left:3px solid var(--accent2);border-radius:8px;padding:12px 14px;margin-top:14px;font-size:13px;color:#c9d3ee;}
  .final-prompt-box{background:#0d1626;border:1px solid var(--border);border-radius:12px;padding:14px;margin-top:10px;
    font-family:'Consolas',monospace;font-size:12.5px;white-space:pre-wrap;color:#8be9a3;}

  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:#2a3454;border-radius:8px;}
</style>
</head>
<body>
<div id="toast-wrap"></div>
<div id="app">

  <div class="title-row">
    <div>
      <div class="brand">🧩 Prompt Puzzle</div>
      <div class="badge" id="header-badge">Master AI Prompting Through Play</div>
    </div>
    <div class="row" id="header-actions"></div>
  </div>

  <!-- SETUP (kept for restart flow, pre-filled from interview) -->
  <div id="setup-screen" class="card hidden">
    <h2>Choose your domain</h2>
    <div class="options-grid" id="domain-grid"></div>
    <h2 style="margin-top:6px;">Choose difficulty</h2>
    <div class="options-grid" id="diff-grid"></div>
    <div style="margin-top:18px;">
      <button class="btn" id="start-btn">Start Puzzle →</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game-screen" class="hidden">
    <div id="hud"></div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="card" id="scenario-card"></div>
    <div id="feedback-panel"></div>
  </div>

  <!-- REPORT -->
  <div id="report-screen" class="hidden card"></div>

</div>

<script>
(function(){
"use strict";

/* ============================= STATE ============================= */
const State = {
  domain:"Coding & Software Development",
  difficulty:"Expert",
  scenarios:[],
  currentIndex:0,
  startTime:null,
  scenarioStartTime:null,
  totalMoves:0,
  wrongPlacements:0,
  hintsUsed:0,
  optimizationBonus:0,
  correctCount:0,
  results:[], // per scenario: {accuracy, timeSec, moves, wrong, hints, optBonus, principle}
};

/* ============================= TOAST / FX ============================= */
function toast(msg, type){
  type = type || "info";
  const wrap = document.getElementById("toast-wrap");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function scorePop(x,y,text,color){
  const el = document.createElement("div");
  el.className = "score-pop";
  el.style.left = x+"px"; el.style.top = y+"px";
  el.style.color = color || "var(--good)";
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1000);
}

/* ============================= SCENARIO BANK ============================= */
/* Coding & Software Development — Expert difficulty */
const CODING_EXPERT = [
  {
    id:"sc1",
    type:"build",
    title:"Designing a Rate-Limited Retry Wrapper",
    context:"You need an AI to generate a production-grade TypeScript utility that wraps async API calls with exponential backoff, jitter, and circuit-breaker behavior.",
    desiredOutput:"A complete TypeScript module with a configurable retry/backoff wrapper, circuit breaker, typed errors, and unit-test stubs.",
    correctBlocks:[
      "Act as a senior backend engineer specializing in resilient distributed systems.",
      "Write a TypeScript module exporting a `withRetry()` higher-order function that wraps any async function.",
      "Implement exponential backoff with jitter, configurable max retries, and a circuit-breaker that opens after N consecutive failures.",
      "Use strict typing, custom error classes (e.g. `CircuitOpenError`), and no external dependencies beyond the standard library.",
      "Include JSDoc comments and 3 example unit test stubs using Jest.",
      "Output only the code in a single fenced TypeScript block, no prose before or after."
    ],
    distractorBlocks:[
      "Make it as short as possible, brevity matters more than correctness.",
      "Explain every line in plain English for a beginner audience.",
      "Use any programming language you prefer, language choice is not important.",
      "Add colorful console.log emojis for fun."
    ],
    weakPrompt:"Write code for retrying API calls.",
    optimizedPrompt:"Act as a senior backend engineer. Write a TypeScript module exporting a withRetry() higher-order function wrapping async calls with exponential backoff + jitter, a circuit breaker that opens after N consecutive failures, custom typed errors, JSDoc, and 3 Jest test stubs. Output only code in a single fenced block.",
    overEngineeredPrompt:"Act as the world's most elite 10x backend engineer who has worked at every FAANG company and won every hackathon, write the most perfect, bulletproof, enterprise-grade, infinitely scalable TypeScript module ever created for retrying async calls, with exponential backoff, jitter, circuit breaker, telemetry hooks, distributed tracing, OpenTelemetry spans, Prometheus metrics, a plugin architecture, i18n error messages, and full documentation site scaffolding, and also explain quantum computing.",
    weakOutput:"Sure! Here's a simple function:\n\nfunction retry(fn) {\n  for (let i=0;i<3;i++){ try { return fn(); } catch(e){} }\n}\n\nThis retries three times. Let me know if you want more!",
    optimizedOutput:"```typescript\nclass CircuitOpenError extends Error {}\n\ninterface RetryOptions { maxRetries?: number; baseDelayMs?: number; failureThreshold?: number; }\n\nexport function withRetry<T extends (...args:any[])=>Promise<any>>(fn: T, opts: RetryOptions = {}): T {\n  const { maxRetries=3, baseDelayMs=200, failureThreshold=5 } = opts;\n  let consecutiveFailures = 0;\n  let circuitOpen = false;\n  return (async (...args: any[]) => {\n    if (circuitOpen) throw new CircuitOpenError('Circuit is open');\n    for (let attempt=0; attempt<=maxRetries; attempt++){\n      try {\n        const result = await fn(...args);\n        consecutiveFailures = 0;\n        return result;\n      } catch (err) {\n        consecutiveFailures++;\n        if (consecutiveFailures >= failureThreshold) circuitOpen = true;\n        if (attempt === maxRetries) throw err;\n        const jitter = Math.random() * baseDelayMs;\n        await new Promise(r => setTimeout(r, baseDelayMs * 2 ** attempt + jitter));\n      }\n    }\n  }) as T;\n}\n\n// Jest stubs\n// test('retries on failure', async () => {...});\n// test('opens circuit after threshold', async () => {...});\n// test('resets after success', async () => {...});\n```",
    principle:"Specificity + Role Assignment + Output Constraints beat vague requests. Defining exact behaviors (backoff, jitter, circuit breaker) and output format removes ambiguity without over-loading the prompt with irrelevant asks."
  },
  {
    id:"sc2",
    type:"clean",
    title:"Cleaning a Bloated Refactoring Prompt",
    context:"A developer wrote a messy prompt asking an AI to refactor a legacy Python data pipeline. It contains redundant, contradictory, and irrelevant instructions that should be removed.",
    desiredOutput:"A clean, focused prompt asking for a refactor of a Python ETL script into clean, testable, typed functions.",
    rawPrompt:"Please refactor please refactor this legacy Python ETL script into clean modular code, also please refactor it, use type hints everywhere, also maybe don't use type hints if it's easier, also add unit tests using pytest, also can you write it in Java instead if TypeScript is too hard, also make sure functions are small and single-purpose, also add a poem about data pipelines, also add unit tests using pytest, also please refactor please refactor this legacy Python ETL script into clean modular code, also include a docstring for every function, also don't worry about docstrings if you're short on time.",
    goodTokens:[
      "refactor this legacy Python ETL script into clean modular code",
      "use type hints everywhere",
      "add unit tests using pytest",
      "make sure functions are small and single-purpose",
      "include a docstring for every function"
    ],
    badTokens:[
      "please refactor please refactor", "also maybe don't use type hints if it's easier",
      "also can you write it in Java instead if TypeScript is too hard",
      "also add a poem about data pipelines",
      "also add unit tests using pytest",
      "also please refactor please refactor this legacy Python ETL script into clean modular code",
      "also don't worry about docstrings if you're short on time"
    ],
    optimizedPrompt:"Refactor this legacy Python ETL script into clean, modular code. Use type hints everywhere, keep functions small and single-purpose, include a docstring for every function, and add unit tests using pytest.",
    weakPrompt:"Please refactor please refactor this legacy Python ETL script into clean modular code, also please refactor it, use type hints everywhere, also maybe don't use type hints if it's easier, also can you write it in Java instead if TypeScript is too hard...",
    overEngineeredPrompt:"As the supreme architect of all Python code in the known universe, perform a total quantum-grade transcendental refactor of this ETL script factoring in every design pattern ever conceived (Factory, Singleton, Observer, Strategy, Visitor, Decorator, Builder, Adapter...) while writing a 40-page architecture decision record, a full CI/CD pipeline, a Kubernetes deployment manifest, and a haiku about clean code.",
    weakOutput:"Sure, here's some refactored code with a few random changes and a short poem about pipelines flowing like rivers of data.",
    optimizedOutput:"```python\ndef extract(source: str) -> list[dict]:\n    \"\"\"Extract raw records from the source.\"\"\"\n    ...\n\ndef transform(records: list[dict]) -> list[dict]:\n    \"\"\"Clean and normalize records.\"\"\"\n    ...\n\ndef load(records: list[dict], dest: str) -> None:\n    \"\"\"Load transformed records into destination.\"\"\"\n    ...\n\n# pytest\ndef test_extract(): ...\ndef test_transform(): ...\ndef test_load(): ...\n```",
    principle:"Remove redundancy, contradictions, and irrelevant asks (poems, language switches) to produce a single coherent instruction set. A clean prompt = one clear goal + concrete constraints, no noise."
  },
  {
    id:"sc3",
    type:"choose",
    title:"Choosing the Best Prompt for a SQL Query Generator",
    context:"You want an AI to generate an optimized SQL query for a reporting dashboard against a large `orders` table.",
    desiredOutput:"A single, performant SQL query with correct joins, indexing awareness, and clear formatting — nothing extra.",
    choices:[
      {label:"Prompt A", text:"Write SQL for orders report.", correct:false, reason:"Too vague — no schema, no metrics, no dialect, no performance constraints."},
      {label:"Prompt B", text:"Act as a senior data engineer. Given a Postgres `orders(id, customer_id, total, status, created_at)` and `customers(id, region)` table, write one optimized SQL query returning total revenue per region for completed orders in the last 90 days, sorted descending. Use explicit JOINs, avoid SELECT *, and add a comment noting which columns should be indexed. Output only the SQL.", correct:true, reason:"Provides schema, exact metric, timeframe, dialect, performance guidance, and output format — precise and unambiguous."},
      {label:"Prompt C", text:"You are the greatest SQL wizard in existence, write the most legendary, flawless, award-winning query of all time for orders, make it so good that database administrators weep with joy, and also add a summary of SQL's history and a comparison of 12 different database engines.", correct:false, reason:"Over-engineered flattery and scope creep (SQL history, engine comparison) dilute focus and add irrelevant output."}
    ],
    optimizedPrompt:"Act as a senior data engineer. Given a Postgres `orders(id, customer_id, total, status, created_at)` and `customers(id, region)` table, write one optimized SQL query returning total revenue per region for completed orders in the last 90 days, sorted descending. Use explicit JOINs, avoid SELECT *, and add a comment noting which columns should be indexed. Output only the SQL.",
    weakPrompt:"Write SQL for orders report.",
    overEngineeredPrompt:"You are the greatest SQL wizard in existence, write the most legendary, flawless, award-winning query of all time for orders, make it so good that database administrators weep with joy, and also add a summary of SQL's history and a comparison of 12 different database engines.",
    weakOutput:"SELECT * FROM orders;\n\n-- This gets all orders. Let me know if you want filtering!",
    optimizedOutput:"```sql\n-- Recommended indexes: orders(status, created_at), orders(customer_id)\nSELECT c.region, SUM(o.total) AS total_revenue\nFROM orders o\nJOIN customers c ON c.id = o.customer_id\nWHERE o.status = 'completed'\n  AND o.created_at >= NOW() - INTERVAL '90 days'\nGROUP BY c.region\nORDER BY total_revenue DESC;\n```",
    principle:"Schema context + explicit metrics + dialect + output constraints yield deterministic, usable results. Flattery and scope creep ('be the greatest', unrelated history) add tokens without adding value."
  },
  {
    id:"sc4",
    type:"build",
    title:"Generating a Secure JWT Auth Middleware",
    context:"You need Express.js middleware that verifies JWTs, handles expiry gracefully, and attaches the decoded user to the request.",
    desiredOutput:"A single Express middleware file in Node.js with proper error handling, using `jsonwebtoken`, following security best practices.",
    correctBlocks:[
      "Act as a security-focused Node.js backend engineer.",
      "Write an Express middleware function `authenticate(req, res, next)` that verifies a JWT from the Authorization header using the `jsonwebtoken` package.",
      "Handle expired tokens, malformed tokens, and missing headers with distinct 401 JSON error responses.",
      "On success, attach the decoded payload to `req.user` and call `next()`.",
      "Read the JWT secret from `process.env.JWT_SECRET` and never hardcode secrets.",
      "Return only the JavaScript code in a single fenced block."
    ],
    distractorBlocks:[
      "Store the secret directly in the code for simplicity.",
      "Add support for 5 different authentication providers even though only JWT was requested.",
      "Write it in Python instead since Node is old-fashioned.",
      "Include a lengthy essay about the history of JSON Web Tokens."
    ],
    weakPrompt:"Make an auth middleware for express.",
    optimizedPrompt:"Act as a security-focused Node.js engineer. Write an Express middleware `authenticate(req,res,next)` verifying a JWT from the Authorization header via jsonwebtoken, handling expired/malformed/missing token cases with distinct 401 JSON responses, attaching decoded payload to req.user, reading the secret from process.env.JWT_SECRET (never hardcoded). Return only the code.",

/* ============================= SCENARIO SELECTION / RANDOMIZATION ============================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initScenarios(){
  // Randomize order, keep all 6 (fits 6-8 range) and shuffle blocks/choices within each
  const pool = shuffle(CODING_EXPERT);
  State.scenarios = pool.map(s=>{
    const clone = JSON.parse(JSON.stringify(s));
    if(clone.type==="build"){
      clone.allBlocks = shuffle(clone.correctBlocks.concat(clone.distractorBlocks));
    }
    if(clone.type==="clean"){
      clone.allTokens = buildTokenSequence(clone);
    }
    if(clone.type==="choose"){
      clone.shuffledChoices = shuffle(clone.choices);
    }
    return clone;
  });
}

function buildTokenSequence(scenario){
  // splits rawPrompt into good/bad labeled fragments by matching known substrings.
  let text = scenario.rawPrompt;
  const fragments = [];
  const markers = scenario.goodTokens.map(t=>({t,good:true})).concat(scenario.badTokens.map(t=>({t,good:false})));
  // sort by position found
  let cursor = 0;
  let safety = 0;
  let remaining = text;
  let offset = 0;
  const found = [];
  markers.forEach(m=>{
    const idx = text.indexOf(m.t, 0);
    if(idx>=0) found.push({...m, idx});
  });
  found.sort((a,b)=>a.idx-b.idx);
  let pos = 0;
  found.forEach(f=>{
    if(f.idx > pos){
      fragments.push({text:text.slice(pos,f.idx), good:null, static:true});
    }
    fragments.push({text:f.t, good:f.good, static:false});
    pos = f.idx + f.t.length;
  });
  if(pos < text.length) fragments.push({text:text.slice(pos), good:null, static:true});
  return fragments;
}

    <div class="stat-pill"><span class="lbl">Scenario</span><b>${State.currentIndex+1}/${State.scenarios.length}</b></div>
    <div class="stat-pill"><span class="lbl">Moves</span><b>${State.totalMoves}</b></div>
    <div class="stat-pill"><span class="lbl">Wrong</span><b>${State.wrongPlacements}</b></div>

    <div class="stat-pill"><span class="lbl">Correct</span><b>${State.correctCount}</b></div>

}
let hudTimer=null;
function startHudClock(){
  if(hudTimer) clearInterval(hudTimer);
  hudTimer = setInterval(()=>{
    const el = document.getElementById("hud-time");
    if(el && State.scenarioStartTime){
      el.textContent = Math.floor((Date.now()-State.startTime)/1000)+"s";
    }

}
function updateProgress(){
  const pct = Math.round((State.currentIndex/State.scenarios.length)*100);

}

/* ---------- Build the Prompt ---------- */
function setupBuildChallenge(s){
  const bank = document.getElementById("bank-list");
  const build = document.getElementById("build-list");
  s.placed = [];

  function renderBank(){
    bank.innerHTML="";
    s.allBlocks.forEach((b,i)=>{
      if(s.placed.includes(i)) return;
      const div = document.createElement("div");
      div.className="block";
      div.draggable=true;
      div.textContent=b;
      div.dataset.idx=i;
      div.addEventListener("dragstart", e=>{
        e.dataTransfer.setData("text/plain", i);
        div.classList.add("dragging");
      });
      div.addEventListener("dragend", ()=>div.classList.remove("dragging"));
      div.addEventListener("click", ()=>{ // tap-to-add for mobile
        addBlock(i);
      });
      bank.appendChild(div);
    });
  }
  function renderBuild(){
    build.innerHTML="";
    s.placed.forEach((idx,order)=>{
      const div = document.createElement("div");
      div.className="block";
      div.textContent = s.allBlocks[idx];
      const rm = document.createElement("span");
      rm.className="rm"; rm.textContent="✕";
      rm.onclick=(e)=>{ e.stopPropagation(); s.placed.splice(order,1); renderBank(); renderBuild(); };
      div.appendChild(rm);
      build.appendChild(div);
    });
    document.getElementById("submit-btn").disabled = s.placed.length===0;
  }
  function addBlock(i){
    if(s.placed.includes(i)) return;
    s.placed.push(i);
    State.totalMoves++;
    const isCorrect = s.correctBlocks.includes(s.allBlocks[i]);
    if(!isCorrect) State.wrongPlacements++;
    renderBank(); renderBuild(); renderHUD();
    toast(isCorrect ? "Good block placed ✓" : "Hmm, that might be a distractor", isCorrect?"good":"bad");
  }

  const buildZone = document.getElementById("build-zone");
  buildZone.addEventListener("dragover", e=>{ e.preventDefault(); buildZone.classList.add("dragover"); });
  buildZone.addEventListener("dragleave", ()=>buildZone.classList.remove("dragover"));
  buildZone.addEventListener("drop", e=>{
    e.preventDefault();
    buildZone.classList.remove("dragover");
    const i = parseInt(e.dataTransfer.getData("text/plain"));
    if(!isNaN(i)) addBlock(i);
  });

  renderBank(); renderBuild();

  document.getElementById("submit-btn").onclick = ()=>{
    const chosenTexts = s.placed.map(i=>s.allBlocks[i]);
    const correctSet = s.correctBlocks;
    const correctChosen = chosenTexts.filter(t=>correctSet.includes(t)).length;
    const wrongChosen = chosenTexts.length - correctChosen;
    const missedCorrect = correctSet.length - correctChosen;
    const accuracy = Math.max(0, Math.round(((correctChosen - wrongChosen*0.5 - missedCorrect*0.5) / correctSet.length)*100));
    finalizeScenario(s, {accuracy: Math.min(100,Math.max(0,accuracy))});
  };
}

/* ---------- Clean the Prompt ---------- */
function setupCleanChallenge(s){
  const box = document.getElementById("clean-box");
  s.flagged = new Set();
  function render(){
    box.innerHTML="";
    s.allTokens.forEach((frag,i)=>{
      if(frag.static){
        const span = document.createElement("span");
        span.textContent = frag.text;
        box.appendChild(span);
        return;
      }
      const span = document.createElement("span");
      span.className = "tok" + (s.flagged.has(i) ? " flagged" : (frag.good ? " locked-good":""));
      span.textContent = frag.text;
      span.onclick = ()=>{
        if(s.flagged.has(i)) s.flagged.delete(i); else s.flagged.add(i);
        State.totalMoves++;
        renderHUD();
        render();
      };
      box.appendChild(span);
    });
    document.getElementById("submit-btn").disabled=false;
  }
  render();

  document.getElementById("submit-btn").onclick = ()=>{
    let correctFlags=0, wrongFlags=0, missedFlags=0;
    s.allTokens.forEach((frag,i)=>{
      if(frag.static) return;
      const flagged = s.flagged.has(i);
      if(!frag.good && flagged) correctFlags++;
      else if(frag.good && flagged){ wrongFlags++; State.wrongPlacements++; }
      else if(!frag.good && !flagged) missedFlags++;
    });
    const totalBad = s.badTokens.length;
    const accuracy = Math.max(0, Math.round(((correctFlags - wrongFlags*0.5 - missedFlags*0.5)/totalBad)*100));
    finalizeScenario(s, {accuracy: Math.min(100,Math.max(0,accuracy))});
  };
}

/* ---------- Choose the Best Prompt ---------- */
function setupChooseChallenge(s){
  const list = document.getElementById("choose-list");
  s.picked = null;
  function render(){
    list.innerHTML="";
    s.shuffledChoices.forEach((c,i)=>{
      const div = document.createElement("div");
      div.className="choice-card";
      if(s.picked===i){
        div.classList.add(c.correct ? "picked-correct":"picked-wrong");
      }
      div.innerHTML = `<span class="tag">${c.label}</span><pre>${escapeHtml(c.text)}</pre>`;
      div.onclick = ()=>{
        if(s.picked!==null) return;
        s.picked = i;
        State.totalMoves++;
        if(!c.correct) State.wrongPlacements++;
        renderHUD();
        render();
        document.getElementById("submit-btn").disabled=false;
        toast(c.correct ? "Strong choice! ✓" : c.reason, c.correct?"good":"bad");
      };
      list.appendChild(div);
    });
  }
  render();

  document.getElementById("submit-btn").onclick = ()=>{
    if(s.picked===null){ toast("Pick a prompt first","bad"); return; }
    const accuracy = s.shuffledChoices[s.picked].correct ? 100 : 20;
    finalizeScenario(s, {accuracy});
  };
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================= HINTS ============================= */
function giveHint(s){
  State.hintsUsed++;
  renderHUD();
  let msg = "";
  if(s.type==="build") msg = "Look for blocks that define role, exact task, constraints, and output format — skip fluff, flattery, or off-topic asks.";
  if(s.type==="clean") msg = "Flag repeated instructions, contradictions (opposite tone/format asks), and anything unrelated to the core coding task.";
  if(s.type==="choose") msg = "The best prompt gives context (schema/environment), a precise measurable task, and an output constraint — without flattery or scope creep.";
  toast("💡 " + msg, "info");
}

/* ============================= SCORING / FINALIZE ============================= */
function finalizeScenario(s, {accuracy, skipped}){
  const timeSec = Math.max(1, Math.round((Date.now()-State.scenarioStartTime)/1000));
  const optBonus = accuracy>=90 ? 15 : accuracy>=70 ? 8 : 0;
  State.optimizationBonus += optBonus;
  if(accuracy>=70) State.correctCount++;

  State.results.push({
    title: s.title,
    type: s.type,
    accuracy: skipped?0:accuracy,
    timeSec,
    optBonus,
    principle: s.principle,
    optimizedPrompt: s.optimizedPrompt,
    skipped: !!skipped
  });

  showFeedback(s, accuracy, skipped);
}

/* ============================= REPORT ============================= */
function computeOverallScore(){
  const n = State.results.length || 1;
  const avgAcc = State.results.reduce((a,r)=>a+r.accuracy,0)/n;
  const movesPenalty = Math.min(15, State.totalMoves*0.3);
  const wrongPenalty = Math.min(20, State.wrongPlacements*3);
  const hintPenalty = Math.min(15, State.hintsUsed*4);
  const base = avgAcc;
  let score = base - movesPenalty*0.2 - wrongPenalty*0.4 - hintPenalty*0.3 + State.optimizationBonus*0.4;
  score = Math.max(0, Math.min(100, Math.round(score)));
  return score;
}
function ratingFor(score){
  if(score>=90) return {label:"Prompt Virtuoso", rank:"S+"};
  if(score>=78) return {label:"Prompt Architect", rank:"A"};
  if(score>=62) return {label:"Prompt Engineer", rank:"B"};
  if(score>=45) return {label:"Prompt Apprentice", rank:"C"};
  return {label:"Prompt Novice", rank:"D"};
}
function dnaTraits(){
  const n = State.results.length||1;
  const avgAcc = State.results.reduce((a,r)=>a+r.accuracy,0)/n;
  const clarity = Math.max(10, Math.min(100, Math.round(avgAcc - State.wrongPlacements*2)));
  const structure = Math.max(10, Math.min(100, Math.round(100 - State.wrongPlacements*5)));
  const efficiency = Math.max(10, Math.min(100, Math.round(100 - State.totalMoves*1.2 - State.hintsUsed*3)));
  const optimization = Math.max(10, Math.min(100, Math.round((State.optimizationBonus/(6*15))*100)));
  const precision = Math.max(10, Math.min(100, Math.round(avgAcc)));
  return [
    {name:"Clarity", val:clarity},
    {name:"Structure", val:structure},
    {name:"Efficiency", val:efficiency},
    {name:"Optimization", val:optimization},
    {name:"Precision", val:precision},
  ];
}

        <table class="stat-table">
          <tr><td>Accuracy (avg)</td><td>${Math.round(State.results.reduce((a,r)=>a+r.accuracy,0)/(State.results.length||1))}%</td></tr>
          <tr><td>Total Time</td><td>${totalTime}s</td></tr>
          <tr><td>Total Moves</td><td>${State.totalMoves}</td></tr>
          <tr><td>Wrong Placements</td><td>${State.wrongPlacements}</td></tr>
          <tr><td>Hints Used</td><td>${State.hintsUsed}</td></tr>
          <tr><td>Optimization Bonus</td><td>+${State.optimizationBonus}</td></tr>
        </table>
      </div>
      <div class="card" style="box-shadow:none;">
        <h3 style="margin-bottom:6px;">🧬 Prompt DNA</h3>
        <div class="dna-bars" id="dna-bars"></div>
        <div class="milestone-box">🎯 ${milestone}</div>
        <p style="margin-top:14px;font-size:13.5px;color:#c9d3ee;">${feedback}</p>
        <h4 style="margin-top:14px;margin-bottom:6px;font-size:13px;color:var(--sub);text-transform:uppercase;">Your Best Optimized Prompt</h4>
        <div class="final-prompt-box">${escapeHtml(finalPrompt)}</div>
      </div>
    </div>
    <div class="row" style="margin-top:20px;">
      <button class="btn" id="replay-btn">🔄 Replay with New Scenarios</button>
      <button class="btn secondary" id="change-domain-btn">⚙️ Change Domain/Difficulty</button>
    </div>
  `;

  const dnaWrap = document.getElementById("dna-bars");
  dna.forEach(d=>{
    const row = document.createElement("div");
    row.className="dna-row";
    row.innerHTML = `<span class="name">${d.name}</span><div class="dna-track"><div class="dna-fill" data-val="${d.val}"></div></div><span class="pct">${d.val}%</span>`;
    dnaWrap.appendChild(row);
  });
  setTimeout(()=>{
    document.querySelectorAll(".dna-fill").forEach(el=>{
      el.style.width = el.dataset.val+"%";
    });
  },100);

  document.getElementById("replay-btn").onclick = ()=>{
    resetRunState();
    initScenarios();
    startGame();
  };
  document.getElementById("change-domain-btn").onclick = ()=>{
    rep.classList.add("hidden");
    document.getElementById("setup-screen").classList.remove("hidden");
    buildSetupUI();
  };
}

/* ============================= GAME FLOW ============================= */
function resetRunState(){
  State.currentIndex=0;
  State.startTime=null;
  State.scenarioStartTime=null;
  State.totalMoves=0;
  State.wrongPlacements=0;
  State.hintsUsed=0;
  State.optimizationBonus=0;
  State.correctCount=0;
  State.results=[];
}

function startGame(){
  document.getElementById("setup-screen").classList.add("hidden");
  document.getElementById("report-screen").classList.add("hidden");
  document.getElementById("game-screen").classList.remove("hidden");
  renderScenario();
  toast(`Domain: ${State.domain} · Difficulty: ${State.difficulty}`, "info");
}

/* ============================= SETUP SCREEN (for replay/change) ============================= */
const DOMAIN_OPTIONS = [
  {name:"Writing & Content Creation", emoji:"✍️", desc:"Blog posts, copywriting, storytelling"},
  {name:"Coding & Software Development", emoji:"💻", desc:"Code gen, debugging, architecture"},
  {name:"Business & Marketing", emoji:"📈", desc:"Strategy, campaigns, analysis"},
  {name:"Data Analysis & Research", emoji:"📊", desc:"Insights, summaries, methodology"},
  {name:"Education & Learning", emoji:"🎓", desc:"Lesson plans, tutoring, explanations"},
  {name:"Creative & Design", emoji:"🎨", desc:"Art direction, image prompts, UX"},
];
const DIFF_OPTIONS = [
  {name:"Beginner", emoji:"🌱", desc:"Foundational prompt structure"},
  {name:"Intermediate", emoji:"🌿", desc:"Constraints & role framing"},
  {name:"Advanced", emoji:"🌳", desc:"Multi-step, edge cases"},
  {name:"Expert", emoji:"🔥", desc:"Precision, tradeoffs, anti-patterns"},
];

function buildSetupUI(){
  const dg = document.getElementById("domain-grid");
  const dfg = document.getElementById("diff-grid");
  dg.innerHTML=""; dfg.innerHTML="";
  DOMAIN_OPTIONS.forEach(d=>{
    const el = document.createElement("div");
    el.className="opt-card" + (d.name===State.domain?" selected":"");
    el.innerHTML = `<div class="emoji">${d.emoji}</div><div class="name">${d.name}</div><div class="desc">${d.desc}</div>`;
    el.onclick=()=>{ State.domain=d.name; buildSetupUI(); };
    dg.appendChild(el);
  });
  DIFF_OPTIONS.forEach(d=>{
    const el = document.createElement("div");
    el.className="opt-card" + (d.name===State.difficulty?" selected":"");
    el.innerHTML = `<div class="emoji">${d.emoji}</div><div class="name">${d.name}</div><div class="desc">${d.desc}</div>`;
    el.onclick=()=>{ State.difficulty=d.name; buildSetupUI(); };
    dfg.appendChild(el);
  });
}

document.getElementById("start-btn").onclick = ()=>{
  resetRunState();
  initScenarios();
  startGame();
};

/* ============================= HEADER ACTIONS ============================= */
document.getElementById("header-actions").innerHTML = `<span class="badge" id="domain-badge"></span>`;
function updateHeaderBadge(){
  const el = document.getElementById("domain-badge");
  if(el) el.textContent = `${State.domain} · ${State.difficulty}`;
}

/* ============================= BOOT ============================= */
// Currently only Coding & Software Development / Expert bank is populated per this session's interview.
// If user changes domain via setup, we fall back to the same bank (kept generic) to guarantee zero errors offline.
function getBankForSelection(){
  return CODING_EXPERT; // single populated bank for this build
}
// Override initScenarios to always use available bank safely
const _origInit = initScenarios;
initScenarios = function(){
  const bank = getBankForSelection();
  const pool = shuffle(bank);
  State.scenarios = pool.map(s=>{
    const clone = JSON.parse(JSON.stringify(s));
    if(clone.type==="build"){
      clone.allBlocks = shuffle(clone.correctBlocks.concat(clone.distractorBlocks));
    }
    if(clone.type==="clean"){
      clone.allTokens = buildTokenSequence(clone);
    }
    if(clone.type==="choose"){
      clone.shuffledChoices = shuffle(clone.choices);
    }
    return clone;
  });
};

updateHeaderBadge();
resetRunState();
initScenarios();
startGame();
setInterval(updateHeaderBadge, 1000);

})();
</script>
